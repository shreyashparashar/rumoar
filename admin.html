<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RUMOAR · Members</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0b0b0b; --bone:#f3f1ec; --mute:#6d6a64; --line:rgba(11,11,11,.14); --flame:#e8401c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Poppins,system-ui,sans-serif; background:var(--bone); color:var(--ink); font-size:14px; }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:18px clamp(16px,4vw,40px); background:var(--ink); color:#fff; }
    header b { font-weight:700; font-size:20px; letter-spacing:.02em; }
    main { padding:24px clamp(16px,4vw,40px) 60px; display:grid; gap:28px; }
    button { font:inherit; border:0; border-radius:999px; padding:10px 18px; background:#fff; color:var(--ink); cursor:pointer; font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; }
    .ink { background:var(--ink); color:#fff; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .stat { background:#fff; padding:18px; } .stat span { display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); } .stat strong { font-size:36px; font-weight:700; }
    h2 { font-size:22px; font-weight:700; margin:0 0 12px; letter-spacing:-.02em; }
    .bars { background:#fff; padding:18px; display:grid; gap:8px; }
    .bar { display:grid; grid-template-columns:150px 1fr 36px; gap:10px; align-items:center; font-size:13px; }
    .bar i { display:block; height:10px; background:var(--flame); min-width:2px; }
    .tablewrap { overflow:auto; background:#fff; }
    table { border-collapse:collapse; width:100%; min-width:860px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); font-weight:700; position:sticky; top:0; background:#fff; }
    .msg { background:#fff; padding:28px; max-width:520px; }
    .muted { color:var(--mute); }
  </style>
</head>
<body>
  <header><b>RUMOAR · Members</b><div id="who" class="muted"></div></header>
  <main id="app"><div class="msg">Loading…</div></main>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
